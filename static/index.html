<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoInstaller</title>
    <link rel="icon" href="./favicon.ico" sizes="any">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --border: #d8dde3;
            --text: #1f2328;
            --muted: #667085;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #dc2626;
            --success: #059669;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .app {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 { margin: 0 0 20px; font-size: 28px; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="url"], select {
            flex: 1 1 520px;
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            min-height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .status {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            line-height: 1.6;
            word-break: break-word;
        }

        .status.info { display: block; background: #eff6ff; color: #1d4ed8; }
        .status.success { display: block; background: #ecfdf3; color: var(--success); }
        .status.error { display: block; background: #fef2f2; color: var(--error); }

        .result-header {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .thumbnail {
            width: 240px;
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #e5e7eb;
        }

        .section-title {
            margin: 0 0 12px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
            font-size: 14px;
        }

        th { background: #f8fafc; }

        .hidden { display: none; }
        .muted { color: var(--muted); }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        a { color: var(--primary); }
    </style>
</head>
<body>
    <div class="app">
        <h1>VideoInstaller</h1>

        <div class="panel">
            <form id="parseForm" class="row">
                <input id="urlInput" type="url" placeholder="输入 YouTube 或 Bilibili 链接" autocomplete="off" required>
                <button type="submit">解析</button>
                <button id="refreshCookieBtn" type="button">刷新 Cookie</button>
            </form>
            <div id="status" class="status"></div>
        </div>

        <div id="resultPanel" class="panel hidden">
            <div class="result-header">
                <img id="thumbnail" class="thumbnail hidden" alt="视频封面">
                <div>
                    <h2 id="videoTitle" class="section-title">解析结果</h2>
                    <div id="sourceMeta" class="muted"></div>
                    <div id="partRow" class="row hidden" style="margin-top: 12px;">
                        <label for="partSelect">分P</label>
                        <select id="partSelect"></select>
                    </div>
                </div>
            </div>

            <div style="margin-top: 18px;">
                <h3 class="section-title">可用音频</h3>
                <table id="audioTable">
                    <thead>
                        <tr>
                            <th>选择</th>
                            <th>格式</th>
                            <th>码率</th>
                            <th>大小</th>
                            <th>说明</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div style="margin-top: 18px;">
                <h3 class="section-title">可用视频</h3>
                <table id="videoTable">
                    <thead>
                        <tr>
                            <th>选择</th>
                            <th>格式</th>
                            <th>分辨率</th>
                            <th>编码</th>
                            <th>码率</th>
                            <th>大小</th>
                            <th>说明</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="actions">
                <button id="downloadOriginalBtn" type="button">下载已选格式</button>
                <button id="downloadTranscodeBtn" type="button">下载并转码</button>
            </div>
        </div>
    </div>
    <script>
        const state = {
            videoInfo: null,
            pollTimer: null
        };

        const elements = {
            form: document.getElementById('parseForm'),
            urlInput: document.getElementById('urlInput'),
            refreshCookieBtn: document.getElementById('refreshCookieBtn'),
            status: document.getElementById('status'),
            resultPanel: document.getElementById('resultPanel'),
            thumbnail: document.getElementById('thumbnail'),
            videoTitle: document.getElementById('videoTitle'),
            sourceMeta: document.getElementById('sourceMeta'),
            partRow: document.getElementById('partRow'),
            partSelect: document.getElementById('partSelect'),
            audioTableBody: document.querySelector('#audioTable tbody'),
            videoTableBody: document.querySelector('#videoTable tbody'),
            downloadOriginalBtn: document.getElementById('downloadOriginalBtn'),
            downloadTranscodeBtn: document.getElementById('downloadTranscodeBtn')
        };

        elements.form.addEventListener('submit', async (event) => {
            event.preventDefault();
            await parseVideo();
        });

        elements.refreshCookieBtn.addEventListener('click', refreshCookie);
        elements.downloadOriginalBtn.addEventListener('click', () => downloadSelected(false));
        elements.downloadTranscodeBtn.addEventListener('click', () => downloadSelected(true));
        elements.partSelect.addEventListener('change', async () => {
            const selected = getSelectedPart();
            if (!selected?.url) return;
            elements.urlInput.value = selected.url;
            await parseVideo(selected.url, `已切换到分P ${selected.p}`);
        });

        const initialUrl = new URL(window.location.href).searchParams.get('url');
        if (initialUrl) {
            elements.urlInput.value = initialUrl;
            parseVideo(initialUrl).catch(() => {});
        }

        async function parseVideo(explicitUrl = '', successMessage = '解析完成') {
            const input = String(explicitUrl || elements.urlInput.value || '').trim();
            if (!input) return;

            setStatus('info', '正在解析，请稍候…');
            elements.resultPanel.classList.add('hidden');

            try {
                const result = await requestJson(`/y2b/parse?url=${encodeURIComponent(input)}`);
                if (!result.success) {
                    setStatus('error', result.error || '解析失败');
                    return;
                }

                state.videoInfo = result.result;
                fillResult(result.result);
                setStatus('success', successMessage);
            } catch (error) {
                setStatus('error', error.message || '解析失败');
            }
        }

        async function refreshCookie() {
            elements.refreshCookieBtn.disabled = true;
            setStatus('info', '正在刷新 Cookie，请稍候…');

            try {
                const result = await requestJson('/y2b/refresh-cookie', {
                    method: 'POST'
                });
                if (!result.success) {
                    setStatus('error', result.error || '刷新 Cookie 失败');
                    return;
                }
                setStatus('success', result.result?.message || 'Cookie 已更新');
            } catch (error) {
                setStatus('error', error.message || '刷新 Cookie 失败');
            } finally {
                elements.refreshCookieBtn.disabled = false;
            }
        }

        function fillResult(info) {
            elements.resultPanel.classList.remove('hidden');
            elements.videoTitle.textContent = info.title || '解析结果';
            elements.sourceMeta.textContent = `${labelWebsite(info.website)}${info.p ? ` · 分P ${info.p}` : ''}`;

            if (info.thumbnail) {
                elements.thumbnail.src = info.thumbnail;
                elements.thumbnail.classList.remove('hidden');
            } else {
                elements.thumbnail.removeAttribute('src');
                elements.thumbnail.classList.add('hidden');
            }

            fillParts(info.parts || [], info.p);
            fillAudioTable(info);
            fillVideoTable(info);
        }

        function fillParts(parts, currentP) {
            elements.partSelect.innerHTML = '';
            if (!Array.isArray(parts) || parts.length === 0) {
                elements.partRow.classList.add('hidden');
                return;
            }

            elements.partRow.classList.remove('hidden');
            parts.forEach((part) => {
                const option = document.createElement('option');
                option.value = part.p;
                option.textContent = `${part.p}. ${part.title}`;
                option.dataset.url = part.url;
                elements.partSelect.appendChild(option);
            });
            elements.partSelect.value = String(currentP || parts[0].p || '1');
        }

        function fillAudioTable(info) {
            elements.audioTableBody.innerHTML = '';
            (info.available?.audios || []).forEach((audio) => {
                const checked = info.best?.audio?.id === audio.id ? 'checked' : '';
                elements.audioTableBody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><input type="radio" name="audio" value="${escapeHtml(audio.id)}" ${checked}></td>
                        <td>${escapeHtml(audio.format || '')}</td>
                        <td>${escapeHtml(audio.rate || '')}</td>
                        <td>${escapeHtml(audio.size || '')}</td>
                        <td>${escapeHtml(audio.info || '')}</td>
                        <td><a href="#" data-single-download="audio" data-id="${escapeHtml(audio.id)}">仅下载音频</a></td>
                    </tr>
                `);
            });
        }

        function fillVideoTable(info) {
            elements.videoTableBody.innerHTML = '';
            (info.available?.videos || []).forEach((video) => {
                const checked = info.best?.video?.id === video.id ? 'checked' : '';
                elements.videoTableBody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><input type="radio" name="video" value="${escapeHtml(video.id)}" ${checked}></td>
                        <td>${escapeHtml(video.format || '')}</td>
                        <td>${escapeHtml(video.scale || '')}</td>
                        <td>${escapeHtml(video.codec || '')}</td>
                        <td>${escapeHtml(video.rate || '')}</td>
                        <td>${escapeHtml(video.size || '')}</td>
                        <td>${escapeHtml(video.info || '')}</td>
                        <td><a href="#" data-single-download="video" data-id="${escapeHtml(video.id)}">仅下载视频</a></td>
                    </tr>
                `);
            });

            document.querySelectorAll('[data-single-download]').forEach((link) => {
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    downloadSingle(link.dataset.id);
                });
            });
        }

        function downloadSingle(formatId) {
            if (!state.videoInfo) return;
            const url = buildDownloadUrl(formatId, false);
            startPolling(url, false);
        }

        function downloadSelected(transcode) {
            if (!state.videoInfo) return;

            const audio = document.querySelector('input[name="audio"]:checked')?.value;
            const video = document.querySelector('input[name="video"]:checked')?.value;
            if (!audio || !video) {
                setStatus('error', '请先选择音频和视频格式');
                return;
            }

            const url = buildDownloadUrl(`${video}x${audio}`, transcode);
            startPolling(url, transcode);
        }

        function startPolling(url, transcode) {
            clearPolling();
            setStatus('info', transcode ? '已开始下载并转码，请稍候…' : '已开始下载，请稍候…');

            state.pollTimer = window.setInterval(async () => {
                try {
                    const response = await requestJson(url);
                    if (!response.success) {
                        clearPolling();
                        setStatus('error', response.error || '下载失败');
                        return;
                    }

                    const result = response.result || {};
                    if (result.downloading) {
                        setStatus('info', result.dest || '正在处理，请稍候…');
                        return;
                    }

                    clearPolling();
                    if (!result.downloadSucceed) {
                        setStatus('error', result.error || '下载失败');
                        return;
                    }

                    setStatus('success', buildDownloadSummary(result), true);
                } catch (error) {
                    clearPolling();
                    setStatus('error', error.message || '下载失败');
                }
            }, 2000);
        }

        function clearPolling() {
            if (state.pollTimer) {
                window.clearInterval(state.pollTimer);
                state.pollTimer = null;
            }
        }

        function buildDownloadUrl(format, transcode) {
            const info = state.videoInfo;
            const params = new URLSearchParams({
                website: info.website,
                v: info.v,
                title: info.title || '',
                format,
                transcode: transcode ? '1' : '0'
            });
            if (info.p) params.set('p', info.p);
            if (info.source) params.set('source', info.source);
            return `/y2b/download?${params.toString()}`;
        }

        function buildDownloadSummary(result) {
            const lines = [`<strong>${result.transcode ? '下载并转码完成' : '下载完成'}</strong>`];
            if (result.dest) lines.push(linkLine('主文件', result.dest));
            if (result.video && result.video !== result.dest) lines.push(linkLine('视频文件', result.video));
            if (result.audio && result.audio !== result.dest) lines.push(linkLine('音频文件', result.audio));
            if (result.metadata) lines.push(linkLine('元数据', result.metadata));
            if (result.folder) lines.push(linkLine('目录', result.folder));
            return lines.join('<br>');
        }

        function linkLine(label, path) {
            const normalized = path.startsWith('/') ? path : `/${path}`;
            return `${label}：<a href="${escapeHtml(normalized)}" target="_blank">${escapeHtml(normalized)}</a>`;
        }

        function getSelectedPart() {
            const option = elements.partSelect.selectedOptions[0];
            if (!option) return null;
            return { p: option.value, url: option.dataset.url || '' };
        }

        async function requestJson(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'x-videoinstaller-request': '1',
                    ...(options.headers || {})
                }
            });
            if (!response.ok) {
                throw new Error(`请求失败：${response.status}`);
            }
            return response.json();
        }

        function setStatus(type, message, allowHtml = false) {
            elements.status.className = `status ${type}`;
            if (allowHtml) {
                elements.status.innerHTML = message || '';
            } else {
                elements.status.textContent = message || '';
            }
        }

        function labelWebsite(website) {
            return website === 'b2b' ? 'Bilibili' : 'YouTube';
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
