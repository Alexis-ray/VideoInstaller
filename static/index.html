<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频解析下载器 | 自动转换为H.264 MP4格式</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        :root {
            --primary: #4CAF50;
            --secondary: #2196F3;
            --light-bg: #f5f5f5;
            --border: #ddd;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--light-bg);
        }

        .title {
            text-align: center;
            margin: 30px 0;
            font-size: 2rem;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .github {
            margin-left: auto;
        }

        #divURL {
            text-align: center;
            margin: 40px 0;
        }

        .search {
            width: 80%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 4px;
            transition: border 0.3s;
        }

        .search:focus {
            border-color: var(--secondary);
            outline: none;
        }

        .available {
            margin: 30px 0 15px;
            color: #333;
            font-size: 1.2rem;
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 30px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .button:hover {
            background-color: #45a049;
        }

        #divResult {
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #thumbnail {
            max-width: 40%;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .codec-tag {
            display: inline-block;
            padding: 3px 8px;
            margin-left: 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .resolution-tag {
            color: #d32f2f;
            font-weight: bold;
        }

        .download-link {
            color: var(--secondary);
            text-decoration: none;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        #log {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .wait-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .format-note {
            background-color: #fff3e0;
            padding: 12px;
            border-left: 4px solid #ff9800;
            margin: 15px 0;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="title">
        <div>视频解析下载器</div>
        <div class="github">
            <a href="https://github.com/develon2015/Youtube-dl-REST" target="_blank">
                <svg style="fill: #333" height="32" viewBox="0 0 16 16" version="1.1" width="32" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z">
                    </path>
                </svg>
            </a>
        </div>
    </div>

    <div id="divURL">
        <form name="parse" onsubmit="parse(); return false;">
            <input class="search" id="url" name="url" type="url" placeholder="请输入 YouTube 视频 URL（可选原始下载或转码 H.264 MP4）"
                autocomplete="off" required>
        </form>
    </div>

    <!-- 格式说明 -->
    <div class="format-note">
        <strong>提示：</strong>你可以选择“原始格式下载”或“下载并转码为H.264 MP4”。转码会更兼容，但耗时更久。
    </div>

    <div id="divResult">
        <div style="text-align: center;">
            <h1 id="title">解析结果</h1>
            <img id="thumbnail" alt="视频封面">
            <div style="margin-top: 10px;">
                <button id="downloadCoverBtn" class="button" type="button" onclick="downloadThumbnail()">保存封面到视频目录</button>
            </div>
        </div>

        <!-- 音频列表 -->
        <div class="available">可用音频</div>
        <table id="audios">
            <tr>
                <th>选择</th>
                <th>格式ID</th>
                <th>容器格式</th>
                <th>码率</th>
                <th>大小</th>
                <th>详情</th>
                <th>操作</th>
            </tr>
        </table>

        <!-- 视频列表（移除编码选择相关内容） -->
        <div class="available">可用视频</div>
        <table id="videos">
            <tr>
                <th>选择</th>
                <th>格式ID</th>
                <th>容器格式</th>
                <th>分辨率</th>
                <th>原始编码</th>
                <th>码率</th>
                <th>大小</th>
                <th>操作</th>
            </tr>
        </table>

        <div style="text-align: center; margin: 30px 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <button id="downloadOriginalBtn" class="button" onclick="download(false)">下载已选格式（原始）</button>
            <button id="downloadTranscodeBtn" class="button" onclick="download(true)">下载并转码（H.264 MP4）</button>
        </div>
    </div>

    <!-- 加载提示 -->
    <div class="wait-msg" id="waitParse">
        <h3>正在解析视频，请稍候...</h3>
    </div>
    <div class="wait-msg" id="waitDownload">
        <h3 id="waitDownloadText">正在下载，请稍候...</h3>
    </div>
    <div class="wait-msg" id="waitTranscode">
        <h3 id="waitTranscodeText">正在转码为 H.264 MP4，请稍候...</h3>
    </div>
    <div id="log">
        <p>更新日志：自动转换为 H.264 编码 MP4 格式、提高设备兼容性、优化转码稳定性</p>
        <p>提示：当前版本专注于 YouTube 视频下载，所有视频可统一转换为 H.264 编码的 MP4 格式，确保在手机、电脑等设备上兼容播放</p>
    </div>

    <script src="js/jquery.js"></script>
    <script src="js/libjrt.js"></script>
    <script>
        // 全局变量存储解析结果
        let videoInfo = null;

        // 初始化页面
        $(() => {
            // 从URL参数加载视频链接
            const urlParam = new URL(document.location.href).searchParams.get('url');
            if (urlParam) {
                const decodedUrl = decodeURIComponent(urlParam)
                    .replace('y2b', 'youtube')
                    .replace('y2', 'youtu');
                $('#url').val(decodedUrl);
                parse(); // 自动解析
            }
            $('#url').focus();
        });

        /**
         * 解析视频信息
         */
        function parse() {
            const url = $('#url').val().trim();
            if (!url) return;

            // 显示加载提示
            $('#divResult').hide();
            $('#waitParse').show();

            // 发送解析请求
            $.ajax({
                url: `/y2b/parse?url=${encodeURIComponent(url.replace('youtube', 'y2b').replace('youtu', 'y2'))}`,
                success: (res) => {
                    $('#waitParse').hide();
                    if (!res.success) {
                        alert(`解析失败：${res.error}`);
                        return;
                    }
                    videoInfo = res.result;
                    fillResult(videoInfo); // 填充解析结果
                    $('#divResult').show();
                },
                error: (xhr) => {
                    $('#waitParse').hide();
                    alert(`解析出错：${xhr.statusText || '网络错误'}`);
                }
            });
        }

        /**
         * 填充解析结果到页面
         */
        function fillResult(info) {
            // 填充基本信息
            $('#title').text(info.title || '视频信息');
            const candidates = (info.thumbnailCandidates && info.thumbnailCandidates.length)
                ? info.thumbnailCandidates
                : [info.thumbnail].filter(Boolean);
            const proxyCandidates = candidates.map((src) => getProxyImg(src));
            $('#thumbnail')
                .data('candidates', proxyCandidates)
                .data('index', 0)
                .off('error')
                .on('error', function () {
                    const list = $(this).data('candidates') || [];
                    let index = Number($(this).data('index') || 0) + 1;
                    if (index < list.length) {
                        $(this).data('index', index).attr('src', list[index]);
                    }
                });
            $('#thumbnail').attr('src', proxyCandidates[0] || '');
            $('#downloadCoverBtn').data('thumbnail-src', candidates[0] || info.thumbnail || '');

            // 填充音频列表
            const audioTable = $('#audios');
            audioTable.find('tr:gt(0)').remove(); // 清空现有行
            info.available.audios.forEach(audio => {
                const row = $(`
                    <tr>
                        <td><input type="radio" name="audio" value="${audio.id}" ${audio.id === info.best.audio.id ? 'checked' : ''}></td>
                        <td>${audio.id}</td>
                        <td>${audio.format}</td>
                        <td>${audio.rate}</td>
                        <td>${audio.size}</td>
                        <td>${audio.info}</td>
                        <td><a class="download-link" href="javascript:downloadSingle('audio', '${audio.id}')">单独下载</a></td>
                    </tr>
                `);
                audioTable.append(row);
            });

            // 填充视频列表（修改为显示原始编码，而非可选择的编码）
            const videoTable = $('#videos');
            videoTable.find('tr:gt(0)').remove(); // 清空现有行
            info.available.videos.forEach(video => {
                // 显示原始编码（仅作参考，最终会转为H.264）
                const codecLabel = video.codec ?
                    `<span class="codec-tag">原始: ${getCodecName(video.codec)}</span>` : '';
                // 突出显示4K分辨率
                const resolution = video.scale.includes('2160') ?
                    `<span class="resolution-tag">${video.scale} (4K)</span>` : video.scale;

                const row = $(`
                    <tr>
                        <td><input type="radio" name="video" value="${video.id}" ${video.id === info.best.video.id ? 'checked' : ''}></td>
                        <td>${video.id}</td>
                        <td>${video.format}</td>
                        <td>${resolution}</td>
                        <td>${codecLabel}</td>
                        <td>${video.rate}</td>
                        <td>${video.size}</td>
                        <td><a class="download-link" href="javascript:downloadSingle('video', '${video.id}')">单独下载</a></td>
                    </tr>
                `);
                videoTable.append(row);
            });

        }

        /**
         * 下载单个音频/视频
         */
        function downloadSingle(type, id) {
            if (!videoInfo) return;
            const url = `/y2b/download?website=${videoInfo.website}&v=${videoInfo.v}&title=${encodeURIComponent(videoInfo.title || '')}&p=${videoInfo.p || ''}&format=${id}&transcode=0`;
            startDownload(url);
        }

        /**
         * 合并下载（音频+视频）
         */
        function download(transcode) {
            if (!videoInfo) return;
            const selectedVideo = $('input[name="video"]:checked').val();
            const selectedAudio = $('input[name="audio"]:checked').val();
            if (!selectedVideo || !selectedAudio) {
                alert('请选择音频和视频格式');
                return;
            }

            const transcodeFlag = transcode ? '1' : '0';
            const url = `/y2b/download?website=${videoInfo.website}&v=${videoInfo.v}&title=${encodeURIComponent(videoInfo.title || '')}&p=${videoInfo.p || ''}&format=${selectedVideo}x${selectedAudio}&transcode=${transcodeFlag}`;
            startDownload(url, transcode);
        }

        /**
         * 启动下载流程
         */
        function startDownload(url, transcode = false) {
            showDownloadModal(transcode);
            const pollInterval = setInterval(() => {
                $.ajax({
                    url: url,
                    success: (res) => {
                        if (!res.success) {
                            clearInterval(pollInterval);
                            hideAllWaitModals();
                            alert(`下载失败：${res.error || res.result.metadata}`);
                            return;
                        }

                        const result = res.result;
                        if (result.phase === 'downloading-video' || result.phase === 'downloading-audio' || result.phase === 'downloading') {
                            showDownloadModal(result.transcode);
                            return;
                        }

                        if (result.phase === 'transcoding') {
                            showTranscodeModal();
                            return;
                        }

                        if (!result.downloading) {
                            clearInterval(pollInterval);
                            hideAllWaitModals();
                            if (result.downloadSucceed) {
                                const formatDesc = result.transcode ? '下载并转码完成' : '下载完成';
                                const path = toDisplayPath(result.dest);
                                alert(`${formatDesc}\n标题：${result.title || videoInfo.title || ''}\n格式：${result.transcode ? 'H.264 MP4' : '原始格式'}\n路径：${path}`);
                            } else {
                                alert(`下载失败：${result.metadata}`);
                            }
                        }
                    },
                    error: () => {
                        clearInterval(pollInterval);
                        hideAllWaitModals();
                        alert('下载请求失败');
                    }
                });
            }, 2000); // 每2秒轮询一次
        }

        function showDownloadModal(transcode) {
            $('#waitTranscode').hide();
            $('#waitDownloadText').text(transcode ? '正在下载原始音视频文件，请稍候...' : '正在下载原始文件，请稍候...');
            $('#waitDownload').show();
        }

        function showTranscodeModal() {
            $('#waitDownload').hide();
            $('#waitTranscodeText').text('正在转码为 H.264 MP4，请稍候...');
            $('#waitTranscode').show();
        }

        function hideAllWaitModals() {
            $('#waitDownload').hide();
            $('#waitTranscode').hide();
        }

        /**
         * 代理封面图片
         */
        function getProxyImg(src) {
            if (src?.startsWith('https://i.ytimg.com/') || src?.match(/^https?:\/\/i\d\.hdslb\.com\//)) {
                return `/pxy?url=${encodeURIComponent(src)}`;
            }
            return src;
        }

        function buildThumbnailEndpoint(info, download) {
            const params = new URLSearchParams({
                website: info.website || '',
                v: info.v || '',
                src: info.thumbnail || '',
                download: download ? '1' : '0',
                t: String(Date.now())
            });
            return `/y2b/thumbnail?${params.toString()}`;
        }

        function downloadThumbnail() {
            if (!videoInfo) return;
            const src = $('#downloadCoverBtn').data('thumbnail-src') || videoInfo.thumbnail || '';
            if (!src) {
                alert('当前没有可用封面图');
                return;
            }
            const params = new URLSearchParams({
                website: videoInfo.website || '',
                v: videoInfo.v || '',
                title: videoInfo.title || '',
                src,
                save: '1',
                t: String(Date.now())
            });
            $.ajax({
                url: `/y2b/thumbnail?${params.toString()}`,
                success: (res) => {
                    if (!res.success) {
                        alert(`封面保存失败：${res.error || '未知错误'}`);
                        return;
                    }
                    alert(`封面已保存\n路径：${toDisplayPath(res.result.dest)}`);
                },
                error: () => alert('封面保存请求失败')
            });
        }

        function toDisplayPath(pathText) {
            const text = String(pathText || '').trim();
            if (!text) return '/';
            return text.startsWith('/') ? text : `/${text}`;
        }

        /**
         * 格式化编码名称（仅作参考，显示原始编码）
         */
        function getCodecName(codec) {
            const codecMap = {
                'avc1': 'H.264',
                'hevc': 'H.265',
                'vp9': 'VP9',
                'av01': 'AV1'
            };
            const mainCodec = codec.split('.')[0];
            return codecMap[mainCodec] || mainCodec;
        }

    </script>
</body>

</html>
